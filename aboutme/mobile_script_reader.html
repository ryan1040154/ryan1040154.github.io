let cur=0;

function render(){
  const s=slides[cur];
  document.getElementById('badge').textContent=`第 ${cur+1} 頁`;
  document.getElementById('top-title').textContent=s.title;
  document.getElementById('counter').textContent=`${cur+1} / ${slides.length}`;
  document.getElementById('s-heading').textContent=s.title;
  document.getElementById('s-sub').textContent=s.sub;
  document.getElementById('s-body').innerHTML=s.paras.map(p=>`<p class="para">${p}</p>`).join('');
  document.getElementById('btn-prev').disabled=cur===0;
  document.getElementById('btn-next').disabled=cur===slides.length-1;
  document.querySelectorAll('.toc-chip').forEach((el,i)=>el.classList.toggle('active',i===cur));
  const active=document.querySelectorAll('.toc-chip')[cur];
  if(active) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function go(d){const n=cur+d;if(n>=0&&n<slides.length){cur=n;render();}}

const bar=document.getElementById('toc-bar');
slides.forEach((s,i)=>{
  const c=document.createElement('button');
  c.className='toc-chip'+(i===0?' active':'');
  c.textContent=`${i+1}. ${s.title}`;
  c.onclick=()=>{cur=i;render();};
  bar.appendChild(c);
});

render();
</script>
