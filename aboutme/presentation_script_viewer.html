let cur = 0;

function render() {
  const s = slides[cur];
  document.getElementById('badge').textContent = `第 ${cur+1} 頁`;
  document.getElementById('header-title').textContent = `${s.title}　${s.sub}`;
  document.getElementById('counter').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === slides.length - 1;
  const c = document.getElementById('content');
  c.innerHTML = s.paras.map(p => `<p class="script-para">${p}</p>`).join('');
  document.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('active', i===cur));
}

function go(d) {
  const n = cur + d;
  if (n >= 0 && n < slides.length) { cur = n; render(); }
}

const nav = document.getElementById('nav-list');
slides.forEach((s,i) => {
  const div = document.createElement('div');
  div.className = 'nav-item' + (i===0?' active':'');
  div.innerHTML = `<span class="nav-num">${i+1}</span><span class="nav-title">${s.title}</span>`;
  div.onclick = () => { cur = i; render(); };
  nav.appendChild(div);
});

render();

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
